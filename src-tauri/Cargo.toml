[package]
name = "tiernan-music-next"
version = "0.1.0"
description = "TiernanMusicNext desktop shell (Tauri 2)"
authors = ["Tiernan"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 直连酷狗用：rustls 避免 openssl 系统依赖；关默认 tls（native-tls）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

[lib]
name = "tiernan_music_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
