name: android

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'attach APKs to a release'
        type: boolean
        default: false

permissions:
  contents: write

# 并发控制：新推送取消旧 run
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # 一个变体失败不取消另一个（此前 system 成功却被 fully 拖着取消）
      matrix:
        variant: [system, fully]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      # Gradle 缓存（首次 98-126s，命中后 Gradle 依赖 + 构建缓存大幅缩短）
      - name: cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.variant }}-${{ hashFiles('android/**/*.gradle*', 'capacitor.config.ts') }}
          restore-keys: gradle-${{ matrix.variant }}-

      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package-lock.json') }}

      - name: install
        run: npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit

      - name: build web dist
        run: npm run build

      - name: capacitor add android (idempotent)
        run: |
          test -d android || npx cap add android
          npx cap sync android

      - name: apply geckoview variant (fully only)
        if: matrix.variant == 'fully'
        run: |
          GV=$(tail -1 tool/geckoview-version.txt | tr -d '[:space:]')
          echo "GeckoView version: $GV"
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('android/build.gradle')
          s = p.read_text()
          if 'maven.mozilla.org' not in s:
              s = s.replace(
                  'allprojects {',
                  'allprojects {\n    repositories {\n        maven { url "https://maven.mozilla.org/maven2" }\n    }',
                  1,
              )
          p.write_text(s)
          print('mozilla repo added')
          PYEOF
          python3 - "$GV" <<'PYEOF'
          import pathlib, sys
          gv = sys.argv[1]
          g = pathlib.Path('android/app/build.gradle')
          s = g.read_text()
          if 'geckoview' not in s:
              s = s.replace(
                  'dependencies {',
                  f'dependencies {{\n    implementation "org.mozilla.geckoview:geckoview:{gv}"',
                  1,
              )
          g.write_text(s)
          print('geckoview dep added:', gv)
          PYEOF
          mkdir -p android/app/src/main/java/com/tiernan/music/next
          cat > android/app/src/main/java/com/tiernan/music/next/GeckoMainActivity.java <<'KTEOF'
          package com.tiernan.music.next;

          import android.app.Activity;
          import android.os.Bundle;
          import org.mozilla.geckoview.GeckoRuntime;
          import org.mozilla.geckoview.GeckoSession;
          import org.mozilla.geckoview.GeckoView;

          /** fully 变体启动页：GeckoView 装载同一 dist（UA 带 GeckoView 标记）。 */
          public class GeckoMainActivity extends Activity {
              private GeckoSession session;
              private GeckoRuntime runtime;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  runtime = GeckoRuntime.create(this);
                  session = new GeckoSession();
                  session.getSettings().setUserAgentOverride(
                      "Mozilla/5.0 GeckoView TiernanMusicNext-Fully");
                  session.open(runtime);
                  GeckoView view = new GeckoView(this);
                  view.setSession(session);
                  setContentView(view);
                  session.loadUri("resource://android/assets/public/index.html");
              }
          }
          KTEOF
          python3 tool/apply_gecko_manifest.py android/app/src/main/AndroidManifest.xml
          echo "geckoview variant applied"

      - name: build apk (release, abi splits + size guard)
        run: |
          cd android
          chmod +x gradlew
          cat > app/build-variant-extras.gradle <<'GVEOF'
          android {
              buildTypes {
                  release {
                      // 压缩加强（用户指令）：R8 full + 资源收缩 + 深度优化
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a'
                      universalApk false
                  }
              }
          }
          GVEOF
          # R8 规则：GeckoView 传递依赖（snakeyaml 引用桌面版 java.beans）在
          # Android 上不存在——dontwarn 掉即可（运行时走不到该分支）
          cat > app/proguard-rules.pro <<'PGEOF'
          -dontwarn java.beans.**
          -dontwarn org.yaml.snakeyaml.**
          -dontwarn org.mozilla.geckoview.**
          PGEOF
          echo 'apply from: "build-variant-extras.gradle"' >> app/build.gradle
          # 构建缓存 + 并行 + 不打 daemon 日志
          ./gradlew assembleRelease --no-daemon --build-cache --parallel

          # 自检：fully 变体必须真把 GeckoMainActivity 编进 dex
          if [ "${{ matrix.variant }}" = "fully" ]; then
            APK=$(ls app/build/outputs/apk/release/*arm64*.apk | head -1)
            rm -rf /tmp/dexchk && mkdir -p /tmp/dexchk
            unzip -o -q "$APK" 'classes*.dex' -d /tmp/dexchk || true
            if grep -qa "GeckoMainActivity" /tmp/dexchk/classes*.dex; then
              echo "GECKO-DEX-CHECK: GeckoMainActivity present ✅"
            else
              echo "::error::GeckoMainActivity 未编入 dex（GeckoView 内核将不生效）"
              exit 1
            fi
          fi

      - name: collect artifacts + size check（体积控制）
        run: |
          mkdir -p dist
          VER=0.1.1
          for f in android/app/build/outputs/apk/release/*arm64*.apk android/app/build/outputs/apk/release/*armeabi*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .apk)
            case "$base" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi*) abi=armeabi-v7a ;;
              *) continue ;;
            esac
            TAG="${{ matrix.variant }}"
            cp "$f" "dist/TiernanMusicNext-${VER}-${TAG}-${abi}.apk"
          done
          python3 - <<'PYEOF'
          import glob, os, sys
          variant = "${{ matrix.variant }}"
          limits = {'system': 25 * 1024 * 1024, 'fully': 180 * 1024 * 1024}
          ok = True
          files = glob.glob('dist/*.apk')
          if not files:
              print('ERROR: 无 ABI 拆分产物（splits 未生效）'); sys.exit(1)
          for f in files:
              sz = os.path.getsize(f)
              limit = limits[variant]
              flag = 'OK' if sz <= limit else 'OVER'
              if sz > limit: ok = False
              print(f"{f} {sz/1024/1024:.1f}MB / limit {limit/1024/1024}MB {flag}")
          sys.exit(0 if ok else 1)
          PYEOF
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: dist/*.apk

  release:
    needs: [apk]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk-system, path: rel }
      - uses: actions/download-artifact@v4
        with: { name: apk-fully, path: rel }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          files: rel/*.apk
          prerelease: true
