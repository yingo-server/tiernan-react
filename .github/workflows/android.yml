name: android

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'attach APKs to a release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 两个变体：system = 系统 WebView（without-webview 包）
        #           fully  = 自带 GeckoView 内核（fully 包）
        variant: [system, fully]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: install
        run: npm ci || npm install

      - name: build web dist
        run: npm run build

      - name: capacitor add android (idempotent)
        run: |
          test -d android || npx cap add android
          npx cap sync android

      - name: apply geckoview variant (fully only)
        if: matrix.variant == 'fully'
        run: |
          # fully：GeckoView 内核打进 APK。保守做法：
          # 1) settings.gradle 加 Mozilla maven 仓库（GeckoView 不在 Google Maven）
          # 2) app 依赖加 org.mozilla.geckoview:geckoview（版本取 tool/geckoview-version.txt）
          # 3) GeckoMainActivity 装载 GeckoView（同 dist 资产，UA 带标记）
          GV=$(tail -1 tool/geckoview-version.txt | tr -d '[:space:]')
          echo "GeckoView version: $GV"
          # 1) Mozilla maven 仓库
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('android/build.gradle')
          s = p.read_text()
          if 'maven.mozilla.org' not in s:
              s = s.replace(
                  'allprojects {',
                  'allprojects {\n    repositories {\n        maven { url "https://maven.mozilla.org/maven2" }\n    }',
                  1,
              )
          p.write_text(s)
          print('mozilla repo added')
          PYEOF
          # 2) 依赖（用占位替换，避免 YAML 内插问题）
          python3 - "$GV" <<'PYEOF'
          import pathlib, sys
          gv = sys.argv[1]
          g = pathlib.Path('android/app/build.gradle')
          s = g.read_text()
          if 'geckoview' not in s:
              s = s.replace(
                  'dependencies {',
                  f'dependencies {{\n    implementation "org.mozilla.geckoview:geckoview:{gv}"',
                  1,
              )
          g.write_text(s)
          print('geckoview dep added:', gv)
          PYEOF
          # 3) GeckoMainActivity（UA 带 GeckoView 标记，gateway.ts 探测用）
          mkdir -p android/app/src/main/java/com/tiernan/music/next
          cat > android/app/src/main/java/com/tiernan/music/next/GeckoMainActivity.kt <<'KTEOF'
          package com.tiernan.music.next

          import android.os.Bundle
          import org.mozilla.geckoview.GeckoRuntime
          import org.mozilla.geckoview.GeckoSession
          import org.mozilla.geckoview.GeckoView

          /** fully 变体启动页：GeckoView 装载同一 dist（UA 带 GeckoView 标记）。 */
          class GeckoMainActivity : android.app.Activity() {
              private lateinit var session: GeckoSession
              private lateinit var runtime: GeckoRuntime
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  runtime = GeckoRuntime.create(this)
                  session = GeckoSession()
                  session.settings.userAgentOverride =
                      "Mozilla/5.0 GeckoView TiernanMusicNext-Fully"
                  session.open(runtime)
                  val view = GeckoView(this)
                  view.setSession(session)
                  setContentView(view)
                  session.loadUri("resource://android/assets/public/index.html")
              }
          }
          KTEOF
          echo "geckoview variant applied"

      - name: build apk (release, abi splits + size guard)
        run: |
          cd android
          chmod +x gradlew
          # 两变体都强制 ABI 拆分（universal 是体积爆炸根因：GeckoView AAR
          # 内含全 ABI 原生库，不拆分则全部塞进一个 APK）。
          cat > app/build-variant-extras.gradle <<'GVEOF'
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                      universalApk false
                  }
              }
          }
          GVEOF
          echo 'apply from: "build-variant-extras.gradle"' >> app/build.gradle
          ./gradlew assembleRelease --no-daemon

      - name: collect artifacts + size check（体积控制）
        run: |
          mkdir -p dist
          VER=0.1.0
          for f in android/app/build/outputs/apk/release/*arm64*.apk android/app/build/outputs/apk/release/*armeabi*.apk android/app/build/outputs/apk/release/*x86_64*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .apk)
            case "$base" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *) continue ;;
            esac
            TAG="${{ matrix.variant }}"
            cp "$f" "dist/TiernanMusicNext-${VER}-${TAG}-${abi}.apk"
          done
          # 体积门禁（用户指令：体积控制）：
          # system（系统 WebView）<= 25MB；fully（内置 GeckoView 单 ABI）<= 180MB（内核物理体积，实测 171.6MB）
          python3 - <<'PYEOF'
          import glob, os, sys
          variant = "${{ matrix.variant }}"
          limits = {'system': 25 * 1024 * 1024, 'fully': 180 * 1024 * 1024}
          ok = True
          files = glob.glob('dist/*.apk')
          if not files:
              print('ERROR: 无 ABI 拆分产物（splits 未生效）'); sys.exit(1)
          for f in files:
              sz = os.path.getsize(f)
              limit = limits[variant]
              flag = 'OK' if sz <= limit else 'OVER'
              if sz > limit: ok = False
              print(f"{f} {sz/1024/1024:.1f}MB / limit {limit/1024/1024}MB {flag}")
          sys.exit(0 if ok else 1)
          PYEOF
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: dist/*.apk

  release:
    needs: [apk]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk-system, path: rel }
      - uses: actions/download-artifact@v4
        with: { name: apk-fully, path: rel }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: rel/*.apk
          prerelease: true
