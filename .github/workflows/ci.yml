name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'publish GitHub Pages / artifacts'
        type: boolean
        default: false

permissions:
  contents: write

# 并发控制：同分支新推送直接取消旧 run（省排队与资源）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 依赖缓存命中时 install 18s → ~3s
      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package-lock.json') }}

      - name: install
        run: npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit

      # typecheck 与 md5 冒烟并行化收益小（各 1-3s），保持串行
      - name: typecheck
        run: npx tsc -b --noEmit

      - name: layout lint（布局数值门禁：页面零手写间距/尺寸）
        if: always()
        run: |
          npx eslint src --ext .ts,.tsx -c eslint.layout.cjs --no-eslintrc 2>&1 | tee /tmp/layout.log || true
          if grep -q "layout.ts（布局数值不由页面决定" /tmp/layout.log; then
            echo "::error::布局数值违规（必须引用 theme/layout.ts 常量）"
            exit 1
          fi
          echo "LAYOUT-LINT-OK"

      - name: md5 签名冒烟（四向量）
        if: always()
        run: npx tsx src/kugou/md5.smoke.ts

      # Vite 构建缓存（transform 缓存）
      - name: cache vite
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ hashFiles('src/**/*.tsx', 'src/**/*.ts', 'vite.config.ts') }}

      - name: build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: [build]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
